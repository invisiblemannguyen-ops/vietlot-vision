name: Test cào Miền Bắc 26-27/11/2026

on:
  workflow_dispatch:

jobs:
  scrape-mb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài thư viện
        run: pip install requests beautifulsoup4 curl_cffi

      - name: Cào MB ngày 26 và 27/11/2026 và ghi Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python test_scraper_mb.py
