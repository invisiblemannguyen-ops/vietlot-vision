name: Cào lại 26-27-28/11/2026 (tất cả đài, ghi đè)

on:
  workflow_dispatch:

jobs:
  rescrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài thư viện
        run: pip install requests beautifulsoup4 curl_cffi

      - name: Cào lại 3 ngày, ghi đè Supabase, kiểm tra 50 kỳ
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python rescrape_26_28.py
