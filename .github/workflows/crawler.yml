name: Auto Lottery Crawler

on:
  schedule:
    # Lịch chạy tự động (Giờ Việt Nam: 16h45, 17h45, 18h45)
    - cron: '45 9,10,11 * * *'
  workflow_dispatch: # Cho phép kích hoạt chạy thủ công bằng nút bấm

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi

      - name: Run Initializer (Nạp 50 kỳ)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python init_50_draws.py
