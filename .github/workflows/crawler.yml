name: Auto Lottery Crawler

on:
  schedule:
    - cron: '45 9 * * *'  # 16:45 Giờ VN (Miền Nam)
    - cron: '45 10 * * *' # 17:45 Giờ VN (Miền Trung)
    - cron: '45 11 * * *' # 18:45 Giờ VN (Miền Bắc)
  workflow_dispatch:      # Nút bấm chạy thủ công

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scrape_minhngoc.py
